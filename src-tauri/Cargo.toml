[package]
name = "sketchback"
version = "0.1.0"
description = "An idea notebook"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

# Both are required: tauri::generate_context! expands to code that names
# serde/serde_json directly, so the app crate must depend on them even though
# nothing here uses them by hand.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
